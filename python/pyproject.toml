[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-fakedata"
version = "2.2.0"
description = "A lightweight generator for realistic Indian demographic data based on Census 2011 statistics."
readme = "README.md"
authors = [
    { name = "Abhay Mourya" }
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []
keywords = [
    "fake-data",
    "synthetic-data",
    "demographic",
    "census",
    "india",
    "abhay557",
    "mock-data",
    "testing",
    "ai-training",
    "data-generation",
    "population-simulator"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0"
]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.mypy]
ignore_missing_imports = true
files = ["src/indian_fakedata"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
indian_fakedata = ["database/*.json", "py.typed"]

[project.scripts]
indian-fakedata = "indian_fakedata.utils.cli:main"
