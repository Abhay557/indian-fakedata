[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-fakedata"
version = "2.0.4"
description = "A lightweight generator for realistic Indian demographic data based on Census 2011 statistics."
readme = "README.md"
authors = [
    { name = "Abhay Mourya" }
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []
keywords = [
    "fake-data",
    "synthetic-data",
    "demographic",
    "census",
    "india",
    "abhay557",
    "mock-data",
    "testing",
    "ai-training",
    "data-generation",
    "population-simulator"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
indian_fakedata = ["database/*.json"]

[project.scripts]
indian-fakedata = "indian_fakedata.utils.cli:main"
